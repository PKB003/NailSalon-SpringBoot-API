services:
  mysql:
    image: mysql:8.0.41
    container_name: mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ttnails}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - booking-network

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: booking-service:local
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/ttnails?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-com.mysql.cj.jdbc.Driver}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SERVER_PORT: 8080
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_VALID_DURATION: ${JWT_VALID_DURATION:-3600}
      JWT_REFRESH_DURATION: ${JWT_REFRESH_DURATION:-7200}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_OPENAPI_SERVER_URL: ${APP_OPENAPI_SERVER_URL:-http://localhost:8080}
      FREE_CANCEL_HOURS: ${FREE_CANCEL_HOURS:-24}
      LATE_CANCEL_ACTION: ${LATE_CANCEL_ACTION:-WARN}
      LATE_CANCEL_FEE_PERCENT: ${LATE_CANCEL_FEE_PERCENT:-0}
      CHECK_IN_WINDOW_HOURS: ${CHECK_IN_WINDOW_HOURS:-24}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      NO_SHOW_MAX_COUNT: ${NO_SHOW_MAX_COUNT:-3}
      NO_SHOW_WINDOW_DAYS: ${NO_SHOW_WINDOW_DAYS:-180}
      NO_SHOW_ENFORCEMENT: ${NO_SHOW_ENFORCEMENT:-BLOCK}
      GUEST_LOOKUP_OTP_TTL_MINUTES: ${GUEST_LOOKUP_OTP_TTL_MINUTES:-10}
      GUEST_LOOKUP_MAX_ATTEMPTS: ${GUEST_LOOKUP_MAX_ATTEMPTS:-5}
      GUEST_LOOKUP_MAX_REQUESTS: ${GUEST_LOOKUP_MAX_REQUESTS:-5}
      GUEST_LOOKUP_RATE_WINDOW_MINUTES: ${GUEST_LOOKUP_RATE_WINDOW_MINUTES:-15}
      GUEST_LOOKUP_EXPOSE_OTP: ${GUEST_LOOKUP_EXPOSE_OTP:-false}
      FISKALY_ENABLED: ${FISKALY_ENABLED:-false}
      FISKALY_BASE_URL: ${FISKALY_BASE_URL:-https://kassensichv.io/api/v2}
      FISKALY_API_KEY: ${FISKALY_API_KEY:-}
      FISKALY_API_SECRET: ${FISKALY_API_SECRET:-}
      FISKALY_TSS_ID: ${FISKALY_TSS_ID:-}
      FISKALY_CLIENT_ID: ${FISKALY_CLIENT_ID:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - booking-network

volumes:
  mysql_data:

networks:
  booking-network:
    driver: bridge
