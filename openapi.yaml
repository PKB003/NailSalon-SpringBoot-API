openapi: 3.1.0
info:
  title: TT Nails Booking API
  version: 1.0.0
  description: |
    Contract v1 (Sprint 0 — đóng băng ngày 2026-11-16) cho backend tiệm nail tại Đức.

    Quy ước chung:
    - Tiền là EUR; DTO hiện trả chuỗi đã format (`"35 €"`), từ Sprint 3 chuyển sang số + `currency`.
    - Mọi response thành công: `{ code, message, timestamp, traceId, data }`.
    - Mọi response lỗi: `{ code, errorCode, message, details?, traceId, timestamp }`; HTTP status
      tương ứng `code`, `errorCode` là mã ổn định để frontend map i18n.
    - `X-Request-Id` (header) được echo lại và trùng với `traceId`.
    - `GET /booking/**` là legacy, **deprecated**; dùng `GET/POST /bookings/**`.
    - Tài liệu sinh tự động từ code: `/v3/api-docs`; Swagger UI: `/swagger-ui.html`.
    - Sprint 1 (2026-11-17): thêm thợ (`/staff/**`), engine availability (`/availability`),
      multi-service (tối đa 3 dịch vụ liên tiếp) và chọn thợ khi đặt lịch.
      `GET /bookings/availability` vẫn tồn tại nhưng **deprecated**.
servers:
  - url: http://localhost:8080
    description: Local / staging
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Services
  - name: Bookings
  - name: Availability
  - name: Staff
  - name: Admin
  - name: Legacy

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập bằng email hoặc số điện thoại
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản khách hàng
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đăng ký thành công (trả kèm token)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Thu hồi token hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Đã đăng xuất
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /auth/introspect:
    post:
      tags: [Auth]
      summary: Kiểm tra token còn hiệu lực
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Kết quả kiểm tra
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { type: boolean }

  /auth/me:
    get:
      tags: [Auth]
      summary: Thông tin người dùng đang đăng nhập
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Auth]
      summary: Cập nhật hồ sơ của mình
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }

  /auth/password:
    put:
      tags: [Auth]
      summary: Đổi mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'

  /users:
    get:
      tags: [Users]
      summary: Danh sách người dùng (ADMIN, phân trang)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, email, phone, dob]
            default: name
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Tạo người dùng (public cho luồng đăng ký cũ)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Chi tiết người dùng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Cập nhật người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Xoá người dùng (chặn nếu còn booking)
      responses:
        '200':
          description: Đã xoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /services:
    get:
      tags: [Services]
      summary: Danh sách dịch vụ (public)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Service' }
    post:
      tags: [Services]
      summary: Tạo dịch vụ (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequest' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Service' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Services]
      summary: Cập nhật dịch vụ (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Service' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Services]
      summary: Xoá dịch vụ (ADMIN)
      responses:
        '200':
          description: Đã xoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '404':
          $ref: '#/components/responses/NotFound'

  /availability:
    get:
      tags: [Availability]
      summary: Slot trống theo dịch vụ và thợ (public, S1)
      description: |
        Engine availability v2: lọc theo ca làm, nghỉ phép, kỹ năng của thợ và các
        booking chưa terminal; trả slot theo từng thợ và union `anyAvailable`.

        - `serviceIds` nhận cả `serviceIds=1,2` và `serviceIds=1&serviceIds=2`; tối đa 3.
        - `staffId` null = mọi thợ đủ điều kiện.
        - `end` = `start + Σduration` của các dịch vụ (không gồm buffer cuối).
      security: []
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-11-20'
        - name: serviceIds
          in: query
          required: false
          description: 1–3 id dịch vụ (hoặc dùng `serviceId` cho client cũ)
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items: { type: integer, format: int64 }
        - name: serviceId
          in: query
          required: false
          description: Alias một dịch vụ duy nhất (legacy)
          schema: { type: integer, format: int64 }
        - name: staffId
          in: query
          required: false
          description: Lọc theo một thợ; bỏ trống = mọi thợ rảnh
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AvailabilityResult' }
        '400':
          description: Thiếu tham số, ngày sai định dạng hoặc quá 3 dịch vụ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /staff:
    get:
      tags: [Staff]
      summary: Danh sách thợ (ADMIN/MANAGER/RECEPTIONIST)
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Staff' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff]
      summary: Tạo thợ (ADMIN/MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffRequest' }
      responses:
        '200':
          description: Đã tạo (envelope `code` = 201)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Staff' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /staff/me:
    get:
      tags: [Staff]
      summary: Hồ sơ thợ của tài khoản đang đăng nhập (NAIL_TECH)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Staff' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Tài khoản chưa được gắn với hồ sơ thợ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /staff/me/bookings:
    get:
      tags: [Staff]
      summary: Lịch của chính thợ (S1-07 — thợ chỉ thấy lịch mình)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /staff/me/shifts:
    get:
      tags: [Staff]
      summary: Ca làm của chính thợ
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Shift' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /staff/me/time-off:
    get:
      tags: [Staff]
      summary: Nghỉ phép của chính thợ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TimeOff' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Staff]
      summary: Thợ tự đăng ký nghỉ phép
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeOffRequest' }
      responses:
        '200':
          description: Đã tạo (envelope `code` = 201)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TimeOff' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /staff/{id}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Staff]
      summary: Chi tiết thợ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Staff' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Staff]
      summary: Cập nhật thợ (ADMIN/MANAGER); `skills != null` thay toàn bộ kỹ năng
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Staff' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Staff]
      summary: Ngừng hoạt động thợ (soft delete, ADMIN/MANAGER)
      responses:
        '200':
          description: Đã ngừng hoạt động
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /staff/{id}/skills:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Staff]
      summary: Kỹ năng của thợ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StaffSkill' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Staff]
      summary: Thay toàn bộ danh sách kỹ năng (ADMIN/MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/SkillRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StaffSkill' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /staff/{id}/shifts:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Staff]
      summary: Ca làm của thợ trong khoảng ngày
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Shift' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff]
      summary: Thêm ca làm (ADMIN/MANAGER), chặn ca chồng lấn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftRequest' }
      responses:
        '200':
          description: Đã tạo (envelope `code` = 201)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Shift' }
        '400':
          description: Thiếu field hoặc `startTime >= endTime` (`INVALID_TIME_RANGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ca chồng lấn (`SHIFT_OVERLAP`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /staff/{id}/shifts/{shiftId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
      - name: shiftId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Staff]
      summary: Xoá ca làm (ADMIN/MANAGER)
      responses:
        '200':
          description: Đã xoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /staff/{id}/time-off:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Staff]
      summary: Danh sách nghỉ phép của thợ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TimeOff' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff]
      summary: Đăng ký nghỉ phép (ADMIN/MANAGER hoặc chính thợ)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeOffRequest' }
      responses:
        '200':
          description: Đã tạo (envelope `code` = 201)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TimeOff' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Trùng nghỉ phép (`TIME_OFF_OVERLAP`) hoặc vướng booking (`TIME_OFF_CONFLICTS_BOOKING`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /staff/{id}/time-off/{timeOffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
      - name: timeOffId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Staff]
      summary: Huỷ nghỉ phép (soft — status CANCELLED, ADMIN/MANAGER)
      responses:
        '200':
          description: Đã huỷ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /staff/{id}/bookings:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Staff]
      summary: Lịch của một thợ (ADMIN/MANAGER/RECEPTIONIST hoặc chính thợ)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    get:
      tags: [Bookings]
      summary: Danh sách booking (ADMIN/MANAGER/RECEPTIONIST) — array hoặc phân trang
      description: |
        Không truyền `page` → trả **array** như S1 (tương thích frontend cũ).
        Có `page` → trả `PageResponse` (S2-09).
      parameters:
        - name: status
          in: query
          description: Trạng thái tiếng Đức (vd. `bestätigt`)
          schema: { type: string }
        - name: staffId
          in: query
          schema: { type: integer, format: int64 }
        - name: serviceId
          in: query
          schema: { type: integer, format: int64 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: q
          in: query
          description: Tìm theo tên / SĐT / email
          schema: { type: string }
        - name: page
          in: query
          description: Bỏ trống = trả array (legacy)
          schema: { type: integer, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          description: '`field,asc|desc`; field ∈ preferredDateTime|startAt|status|id'
          schema: { type: string, example: 'startAt,asc' }
      responses:
        '200':
          description: Array (không page) hoặc PageResponse (có page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: '#/components/schemas/Booking' }
                          - allOf:
                              - $ref: '#/components/schemas/PageMeta'
                              - type: object
                                properties:
                                  content:
                                    type: array
                                    items: { $ref: '#/components/schemas/Booking' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Bookings]
      summary: Tạo booking (guest hoặc user đăng nhập)
      description: |
        S1: nhận 1–3 dịch vụ (`serviceIds`) hoặc 1 dịch vụ (`serviceId` legacy),
        có thể chọn thợ (`staffId`) hoặc để hệ thống tự chọn thợ ít việc nhất.

        S2: booking mới ở trạng thái `bestätigt` + có `confirmationCode`.
        Gửi `Idempotency-Key` để retry không tạo booking trùng (S2-07).
        Khách vượt ngưỡng no-show → `409 NO_SHOW_BLOCKED` (staff override bằng
        `overrideNoShow`).

        Server giữ khóa staff row + kiểm tra overlap trong transaction
        `READ_COMMITTED`, nên hai request đồng thời trên cùng slot chỉ một request
        thành công (request còn lại nhận 409 `SLOT_TAKEN`).
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 'Khóa idempotent cho retry (tối đa 190 ký tự)'
          schema: { type: string, maxLength: 190 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '200':
          description: Đã tạo (HTTP 200 theo controller hiện tại)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Validation, ngoài giờ mở cửa (`OUTSIDE_OPENING_HOURS`) hoặc quá 3 dịch vụ (`TOO_MANY_SERVICES`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Không tìm thấy dịch vụ hoặc thợ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `SLOT_TAKEN` / `NO_STAFF_AVAILABLE` / `NO_SHOW_BLOCKED` /
            `IDEMPOTENCY_KEY_REUSED` / `IDEMPOTENCY_IN_PROGRESS`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bookings/availability:
    get:
      tags: [Legacy]
      deprecated: true
      summary: '[DEPRECATED] Slot trống trong ngày — dùng GET /availability'
      description: Giữ để tương thích Sprint 0; trả danh sách giờ bắt đầu của mọi thợ.
      security: []
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-11-20'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /bookings/my:
    get:
      tags: [Bookings]
      summary: Booking của khách đang đăng nhập
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Booking' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bookings/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    patch:
      tags: [Bookings]
      summary: Huỷ booking (chủ booking hoặc ADMIN/MANAGER/RECEPTIONIST)
      description: |
        Chính sách 24h (D4): khách huỷ trong vòng 24h vẫn được (mặc định `WARN`),
        response có `cancellation.late = true`. Có thể bật `FEE`/`BLOCK` qua
        `cancellation_policy` hoặc `LATE_CANCEL_ACTION`.
      parameters:
        - name: reason
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Đã huỷ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Lịch đã qua (`APPOINTMENT_PASSED`) hoặc thiếu lý do (`REASON_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`BOOKING_ALREADY_CANCELLED` / `BOOKING_TERMINAL` / `LATE_CANCEL_BLOCKED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bookings/{id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    patch:
      tags: [Bookings]
      summary: Đổi lịch booking (S2-02)
      description: |
        Khách chỉ đổi được khi còn ≥ `FREE_CANCEL_HOURS` (mặc định 24h).
        Staff được override nhưng bắt buộc gửi `reason`. Mỗi lần đổi lưu
        `booking_version` và tăng `versionNo`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleRequest' }
      responses:
        '200':
          description: Đã đổi lịch
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Booking' }
        '400':
          description: '`RESCHEDULE_TOO_LATE` / `REASON_REQUIRED` / lỗi validation'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`SLOT_TAKEN` / `BOOKING_TERMINAL` / `INVALID_STATUS_TRANSITION`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bookings/{id}/no-show:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    patch:
      tags: [Bookings]
      summary: Đánh dấu khách không đến (S2-05)
      description: |
        Mặc định chỉ đánh dấu được sau giờ hẹn. Staff có thể `override: true`
        trước giờ nhưng phải kèm `reason`. Đánh dấu lại là idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoShowRequest' }
      responses:
        '200':
          description: Đã đánh dấu `nicht erschienen`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Thiếu lý do (`REASON_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: '`NO_SHOW_TOO_EARLY` / `BOOKING_TERMINAL` / `INVALID_STATUS_TRANSITION`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bookings/{id}/history:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      summary: Lịch sử trạng thái booking (S2-01)
      description: Chủ booking hoặc ADMIN/MANAGER/RECEPTIONIST.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BookingStatusHistory' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/lookup:
    post:
      tags: [Bookings]
      summary: Bước 1 tra cứu guest — confirmation code + SĐT (S2-08)
      description: |
        Tạo OTP gửi qua SMS. Sai code hoặc SĐT đều trả cùng
        `INVALID_CONFIRMATION_CODE`. Rate limit theo SĐT → `429 TOO_MANY_REQUESTS`.
        OTP chỉ trả trong response khi `GUEST_LOOKUP_EXPOSE_OTP=true` (dev/test).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestLookupRequest' }
      responses:
        '200':
          description: Đã gửi OTP (nếu thông tin khớp)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GuestLookupChallenge' }
        '400':
          description: '`INVALID_CONFIRMATION_CODE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: '`TOO_MANY_REQUESTS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bookings/lookup/verify:
    post:
      tags: [Bookings]
      summary: Bước 2 tra cứu guest — xác thực OTP (S2-08)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestLookupVerifyRequest' }
      responses:
        '200':
          description: Trả booking sau khi xác thực
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GuestLookupResult' }
        '400':
          description: '`INVALID_OTP` / `OTP_EXPIRED` / `INVALID_CONFIRMATION_CODE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: '`OTP_TOO_MANY_ATTEMPTS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /waitlist:
    post:
      tags: [Waitlist]
      summary: Đăng ký chờ slot (public)
      description: |
        Mỗi `SĐT + dịch vụ + ngày` chỉ có một entry ACTIVE → trùng trả
        `409 WAITLIST_DUPLICATE`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistRequest' }
      responses:
        '201':
          description: Đã đăng ký
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WaitlistEntry' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`WAITLIST_DUPLICATE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Waitlist]
      summary: Danh sách waitlist (ADMIN/MANAGER/RECEPTIONIST)
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: serviceId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, NOTIFIED, CANCELLED, EXPIRED] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/WaitlistEntry' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /waitlist/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Waitlist]
      summary: Huỷ đăng ký waitlist (khách nhập đúng SĐT, hoặc staff)
      security: []
      parameters:
        - name: phone
          in: query
          required: false
          description: Bắt buộc với khách (không có token)
          schema: { type: string }
      responses:
        '200':
          description: Đã huỷ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit:
    get:
      tags: [Admin]
      summary: Audit log append-only (ADMIN, S2-06)
      parameters:
        - name: entityType
          in: query
          schema: { type: string, example: BOOKING }
        - name: entityId
          in: query
          schema: { type: string, example: '101' }
        - name: action
          in: query
          schema: { type: string, example: BOOKING_CANCEL }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/AuditLog' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /bookings/{id}/status:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    patch:
      tags: [Bookings]
      summary: Đổi trạng thái booking (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingStatusRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Booking' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /customers:
    get:
      tags: [Admin]
      summary: Danh sách khách hàng tổng hợp (ADMIN) — array hoặc phân trang
      description: |
        Không truyền `page` → array (legacy). Có `page` → `PageResponse` (S2-09).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: '#/components/schemas/Customer' }
                          - allOf:
                              - $ref: '#/components/schemas/PageMeta'
                              - type: object
                                properties:
                                  content:
                                    type: array
                                    items: { $ref: '#/components/schemas/Customer' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /stats/dashboard:
    get:
      tags: [Admin]
      summary: Số liệu dashboard (ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardStats' }

  /booking:
    get:
      tags: [Legacy]
      deprecated: true
      summary: '[DEPRECATED] Toàn bộ booking'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LegacyBooking' }

  /booking/{id}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Legacy]
      deprecated: true
      summary: '[DEPRECATED] Chi tiết booking'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LegacyBooking' }
    delete:
      tags: [Legacy]
      deprecated: true
      summary: '[DEPRECATED] Xoá booking'
      responses:
        '200':
          description: Đã xoá
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiEnvelope' }

  /booking/guest:
    post:
      tags: [Legacy]
      deprecated: true
      summary: '[DEPRECATED] Guest tạo booking (không kiểm tra opening hours)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyGuestBookingRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LegacyBooking' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StaffId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Request không hợp lệ (validation hoặc nghiệp vụ)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Thiếu/sai token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Xung đột trạng thái/dữ liệu (SLOT_FULL, trùng email, transition sai…)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ApiEnvelope:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: integer
          description: HTTP status
          example: 200
        message: { type: string, example: Success }
        timestamp: { type: string, format: date-time }
        traceId:
          type: string
          description: Trùng header X-Request-Id
        data:
          description: Payload — kiểu cụ thể được override ở từng operation
        result:
          description: Alias cũ của `data` (giữ 1 sprint để tương thích)

    ErrorResponse:
      type: object
      required: [code, errorCode, message, timestamp]
      properties:
        code: { type: integer, example: 409 }
        errorCode:
          type: string
          description: Mã ổn định để frontend map i18n
          example: SLOT_FULL
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ValidationErrorDetail' }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: date }
        message: { type: string, example: Date must have format yyyy-MM-dd }

    PageMeta:
      type: object
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Anna Müller }
        email: { type: string, format: email }
        phone: { type: string, example: '+4915112345678' }
        role:
          type: string
          enum: [USER, NAIL_TECH, RECEPTIONIST, MANAGER, ADMIN]
        birthday: { type: string, format: date }
        address: { type: string }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }

    UserRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        verifiedPhone: { type: boolean }
        verifiedEmail: { type: boolean }
        roles:
          type: array
          items: { type: string }
        dob: { type: string, format: date }
        address: { type: string }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }

    LoginRequest:
      type: object
      properties:
        emailOrPhone: { type: string, example: anna@test.de }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, format: password }
      required: [password]

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    RegisterRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, format: password }
        birthday: { type: string, format: date }

    ProfileUpdateRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        birthday: { type: string, format: date }

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    Service:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Maniküre }
        description: { type: string }
        duration: { type: integer, description: phút, example: 45 }
        price: { type: number, format: double, example: 28.0 }
        kategorie: { type: string, example: Nagelpflege }
        beliebtheit: { type: string, example: hoch }

    ServiceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        duration: { type: integer }
        price: { type: number }
        kategorie: { type: string }
        beliebtheit: { type: string }

    Booking:
      type: object
      properties:
        id: { type: integer, format: int64 }
        serviceId: { type: integer, format: int64, description: 'Dịch vụ đầu tiên (giữ tương thích client cũ)' }
        service: { type: string, example: 'Pediküre + Maniküre', description: 'Tên các dịch vụ nối bằng " + "' }
        dienstleistung: { type: string, example: 'Pediküre + Maniküre' }
        date: { type: string, format: date, example: '20.11.2026' }
        datum: { type: string, example: '20.11.2026' }
        time: { type: string, example: '14:30' }
        uhrzeit: { type: string, example: '14:30' }
        endDate: { type: string, example: '20.11.2026', description: 'Ngày kết thúc dịch vụ (không gồm buffer)' }
        endTime: { type: string, example: '16:15' }
        endUhrzeit: { type: string, example: '16:15' }
        name: { type: string }
        kunde: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        note: { type: string }
        employee: { type: string }
        mitarbeiter: { type: string }
        staffId: { type: integer, format: int64 }
        staffName: { type: string, example: Minh }
        status:
          type: string
          description: 'Terminal: abgeschlossen | storniert | nicht erschienen | abgelaufen'
          enum: [zahlung ausstehend, bestätigt, eingecheckt, 'in Bearbeitung', abgeschlossen, storniert, 'nicht erschienen', abgelaufen]
        confirmationCode:
          type: string
          description: 'S2-08: mã tra cứu cho guest, ví dụ TT-7K3M9Q'
        versionNo:
          type: integer
          description: 'S2-02: số phiên bản lịch, tăng mỗi lần reschedule'
        cancellation:
          allOf:
            - $ref: '#/components/schemas/CancellationInfo'
          nullable: true
        price: { type: string, description: 'Chuỗi đã format EUR, ví dụ "63 €"' }
        priceSnapshot:
          type: number
          format: double
          description: 'Tổng giá tại thời điểm đặt (EUR), không đổi khi bảng giá cập nhật'
        currency: { type: string, example: EUR }
        totalDurationMinutes:
          type: integer
          description: 'Σ duration của các dịch vụ (không gồm buffer), ví dụ 105'
        items:
          type: array
          description: 'Chi tiết từng dịch vụ — chỉ trả ở POST /bookings và các endpoint chi tiết'
          items: { $ref: '#/components/schemas/BookingItem' }

    BookingItem:
      type: object
      properties:
        serviceId: { type: integer, format: int64 }
        name: { type: string, example: Pediküre }
        startTime: { type: string, example: '14:30' }
        endTime: { type: string, example: '15:30' }
        duration: { type: integer, example: 60 }
        price: { type: number, format: double, example: 35.0 }
        currency: { type: string, example: EUR }
        staffId: { type: integer, format: int64 }
        staffName: { type: string, example: Minh }

    CreateBookingRequest:
      type: object
      required: [date, time, name, phone, email]
      description: |
        Gửi `serviceIds` (1–3, ưu tiên) hoặc `serviceId` (legacy). Phải có ít nhất một.
        Các dịch vụ được thực hiện **liên tiếp** bởi cùng một thợ; buffer 10' chỉ
        cộng ở cuối toàn bộ appointment.
      properties:
        serviceId:
          type: integer
          format: int64
          description: 'Legacy — một dịch vụ duy nhất'
        serviceIds:
          type: array
          maxItems: 3
          items: { type: integer, format: int64 }
          example: [2, 1]
        staffId:
          type: integer
          format: int64
          description: 'Thợ mong muốn; bỏ trống = tự chọn thợ ít việc nhất'
        date: { type: string, format: date, example: '2026-11-20' }
        time: { type: string, example: '14:30', description: 'HH:mm, bước 30 phút, 09:00–18:00' }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        note: { type: string }
        overrideNoShow:
          type: boolean
          description: 'S2-05: staff bỏ qua ngưỡng no-show (bị bỏ qua nếu không phải staff)'

    BookingStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [zahlung ausstehend, bestätigt, eingecheckt, 'in Bearbeitung', abgeschlossen, storniert, 'nicht erschienen', abgelaufen]
        employee: { type: string }
        reason:
          type: string
          description: 'Bắt buộc với một số transition (vd. abgelaufen, đổi lịch quá cutoff)'

    RescheduleRequest:
      type: object
      required: [date, time]
      properties:
        date: { type: string, format: date, example: '2026-11-25' }
        time: { type: string, example: '14:00' }
        serviceIds:
          type: array
          maxItems: 3
          description: 'Bỏ trống = giữ nguyên dịch vụ hiện tại'
          items: { type: integer, format: int64 }
        staffId:
          type: integer
          format: int64
          description: 'Bỏ trống = giữ thợ hiện tại'
        reason:
          type: string
          description: 'Bắt buộc khi staff override cutoff 24h'
        note: { type: string }

    NoShowRequest:
      type: object
      properties:
        reason: { type: string }
        override:
          type: boolean
          description: 'Cho phép đánh dấu trước giờ hẹn (staff, bắt buộc kèm reason)'

    CancellationInfo:
      type: object
      properties:
        late: { type: boolean }
        feeAmount: { type: number, format: double, example: 0 }
        refundAmount: { type: number, format: double, example: 0 }
        reason: { type: string }
        requestedByRole: { type: string, example: USER }
        cancelledAt: { type: string, format: date-time }

    BookingStatusHistory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fromStatus: { type: string, nullable: true, example: bestätigt }
        toStatus: { type: string, example: storniert }
        actorId: { type: string, format: uuid, nullable: true }
        actorLabel: { type: string, example: admin@gmail.com }
        actorRole: { type: string, example: ADMIN }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    GuestLookupRequest:
      type: object
      required: [confirmationCode, phone]
      properties:
        confirmationCode: { type: string, maxLength: 16, example: TT-7K3M9Q }
        phone: { type: string, example: '0176 12345678' }

    GuestLookupVerifyRequest:
      type: object
      required: [challengeId, otp]
      properties:
        challengeId: { type: string, format: uuid }
        otp: { type: string, example: '123456' }

    GuestLookupChallenge:
      type: object
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        attemptsRemaining: { type: integer, example: 5 }
        otp:
          type: string
          nullable: true
          description: 'Chỉ có khi GUEST_LOOKUP_EXPOSE_OTP=true (dev/test)'
        message: { type: string }

    GuestLookupResult:
      type: object
      properties:
        booking: { $ref: '#/components/schemas/Booking' }
        otherBookings:
          type: array
          items: { $ref: '#/components/schemas/Booking' }

    WaitlistRequest:
      type: object
      required: [serviceId, desiredDate, phone]
      properties:
        serviceId: { type: integer, format: int64 }
        desiredDate: { type: string, format: date, example: '2026-11-25' }
        desiredStartTime: { type: string, nullable: true, example: '09:00' }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        note: { type: string }

    WaitlistEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        serviceId: { type: integer, format: int64 }
        serviceName: { type: string, example: Pediküre }
        desiredDate: { type: string, format: date }
        desiredStartTime: { type: string, nullable: true }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        note: { type: string }
        status: { type: string, enum: [ACTIVE, NOTIFIED, CANCELLED, EXPIRED] }
        notifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: string, format: uuid, nullable: true }
        actorEmail: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        action: { type: string, example: BOOKING_CANCEL }
        entityType: { type: string, example: BOOKING }
        entityId: { type: string, example: '101' }
        beforeJson: { type: string, nullable: true }
        afterJson: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        traceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AvailabilityResult:
      type: object
      description: Response của `GET /availability` (S1)
      properties:
        date: { type: string, format: date, example: '2026-11-20' }
        timezone: { type: string, example: Europe/Berlin }
        slotStepMinutes: { type: integer, example: 30 }
        totalDurationMinutes: { type: integer, example: 105 }
        staff:
          type: array
          items: { $ref: '#/components/schemas/StaffSlots' }
        anyAvailable:
          type: array
          description: Union giờ bắt đầu của mọi thợ, đã sắp xếp
          items: { type: string, example: '09:00' }

    StaffSlots:
      type: object
      properties:
        staffId: { type: integer, format: int64 }
        name: { type: string, example: Minh }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }

    Slot:
      type: object
      properties:
        start: { type: string, example: '09:00' }
        end: { type: string, example: '10:45', description: 'start + Σduration (không gồm buffer)' }

    Staff:
      type: object
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string, example: Minh }
        color: { type: string, example: '#E91E63' }
        active: { type: boolean }
        commissionRate: { type: number, format: double, example: 0.4 }
        branchId: { type: integer, format: int64 }
        userId: { type: string, format: uuid, description: 'Tài khoản gắn với thợ (optional)' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/StaffSkill' }

    StaffSkill:
      type: object
      properties:
        serviceId: { type: integer, format: int64 }
        serviceName: { type: string, example: Maniküre }
        duration: { type: integer, example: 45 }
        price: { type: number, format: double, example: 28.0 }
        level: { type: string, enum: [BASIC, ADVANCED, EXPERT] }

    StaffRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        userId: { type: string, format: uuid }
        branchId: { type: integer, format: int64 }
        color: { type: string }
        active: { type: boolean }
        commissionRate: { type: number, minimum: 0, maximum: 1 }
        skills:
          type: array
          description: 'PUT: null = giữ nguyên, [] = xoá hết'
          items: { $ref: '#/components/schemas/SkillRequest' }

    SkillRequest:
      type: object
      required: [serviceId]
      properties:
        serviceId: { type: integer, format: int64 }
        level: { type: string, enum: [BASIC, ADVANCED, EXPERT], default: BASIC }

    Shift:
      type: object
      properties:
        id: { type: integer, format: int64 }
        staffId: { type: integer, format: int64 }
        workDate: { type: string, format: date }
        startTime: { type: string, example: '09:00' }
        endTime: { type: string, example: '18:00' }

    ShiftRequest:
      type: object
      required: [workDate, startTime, endTime]
      properties:
        workDate: { type: string, format: date }
        startTime: { type: string, example: '09:00' }
        endTime: { type: string, example: '18:00' }

    TimeOff:
      type: object
      properties:
        id: { type: integer, format: int64 }
        staffId: { type: integer, format: int64 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED] }

    TimeOffRequest:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        reason: { type: string, maxLength: 255 }

    AvailabilityResponse:
      type: object
      deprecated: true
      description: Response legacy của `GET /bookings/availability`
      properties:
        slots:
          type: array
          items: { type: string, example: '09:00' }

    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        telefon: { type: string }
        email: { type: string, format: email }
        letzterBesuch: { type: string }
        besuche: { type: integer, format: int64 }
        noShowCount:
          type: integer
          format: int64
          description: 'S2-05: số lần khách không đến (nicht erschienen)'

    DashboardStats:
      type: object
      properties:
        todayBookings: { type: integer, format: int64 }
        monthlyRevenue: { type: number, format: double }
        totalCustomers: { type: integer, format: int64 }
        topService: { type: string }
        bookingsTrend: { type: string }
        revenueTrend: { type: string }

    LegacyBooking:
      type: object
      properties:
        id: { type: integer, format: int64 }
        service: { type: string }
        preferredDateAndTime: { type: string, format: date-time }
        note: { type: string }
        userName: { type: string }
        userEmail: { type: string, format: email }
        userPhone: { type: string }

    LegacyGuestBookingRequest:
      type: object
      required: [firstName, lastName, email, phone, service, preferredDateAndTime]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, example: '01761234567' }
        service: { type: string }
        preferredDateAndTime: { type: string, format: date-time }
        note: { type: string }
