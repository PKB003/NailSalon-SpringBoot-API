spring.application.name=booking-service

# =====================================================================
# Server
# =====================================================================
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# =====================================================================
# Database (MySQL 8) — mọi giá trị đều override được bằng biến môi trường
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ttnails?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# =====================================================================
# JPA / Hibernate
# Schema do Flyway quản lý. Staging/prod: none (hoặc validate sau lần deploy đầu).
# =====================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# UUID lưu CHAR(36) — khớp V1__init.sql, dễ đọc/export kế toán hơn BINARY(16)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# =====================================================================
# Flyway (S0-04)
# baseline-on-migrate: DB cũ đã có bảng (tạo bởi ddl-auto=update) sẽ được đánh dấu V1
# =====================================================================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# =====================================================================
# JWT — biến môi trường cùng tên sẽ override (SystemEnvironment ưu tiên hơn file)
# =====================================================================
JWT_SECRET_KEY=M0N2OArmuTzgyhbzdBmQeAqKKU/jacPLlDenKym6rYUM/abfXnH3WPpVHNPdEFkl
JWT_VALID_DURATION=3600
JWT_REFRESH_DURATION=7200

# Mật khẩu admin seed lần đầu. Bỏ trống -> sinh ngẫu nhiên và in trong log.
# Biến môi trường ADMIN_PASSWORD (nếu có) tự động override giá trị này.
ADMIN_PASSWORD=

# =====================================================================
# CORS
# =====================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =====================================================================
# Observability (S0-05 healthcheck + vận hành)
# =====================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

logging.pattern.level=%5p [%X{requestId:-}]

# =====================================================================
# OpenAPI / Swagger UI (S0-01)
# =====================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
app.openapi.server-url=${APP_OPENAPI_SERVER_URL:http://localhost:8080}

# =====================================================================
# fiskaly SIGN DE (S0-10/S3-T10) — chưa có credential thật (2026-11-20)
# KHÔNG commit secret thật. Xem docs/tse/fiskaly-setup.md + docs/tse/tse-design.md
# =====================================================================
fiskaly.enabled=${FISKALY_ENABLED:false}
fiskaly.provider=fiskaly
fiskaly.environment=${FISKALY_ENVIRONMENT:SANDBOX}
fiskaly.base-url=${FISKALY_BASE_URL:https://kassensichv.io/api/v2}
fiskaly.api-key=${FISKALY_API_KEY:}
fiskaly.api-secret=${FISKALY_API_SECRET:}
fiskaly.tss-id=${FISKALY_TSS_ID:}
fiskaly.client-id=${FISKALY_CLIENT_ID:}
fiskaly.timeout-ms=${FISKALY_TIMEOUT_MS:3000}
fiskaly.retry.max-attempts=${FISKALY_RETRY_MAX_ATTEMPTS:3}
fiskaly.retry.initial-backoff-ms=${FISKALY_RETRY_BACKOFF_MS:500}

# =====================================================================
# Sprint 2 — booking policy & guest lookup (D4)
# =====================================================================
app.policy.free-cancel-hours=${FREE_CANCEL_HOURS:24}
app.policy.late-cancel-action=${LATE_CANCEL_ACTION:WARN}
app.policy.late-cancel-fee-percent=${LATE_CANCEL_FEE_PERCENT:0}
app.policy.check-in-window-hours=${CHECK_IN_WINDOW_HOURS:24}
app.policy.idempotency-ttl-hours=${IDEMPOTENCY_TTL_HOURS:24}
app.policy.no-show.max-count=${NO_SHOW_MAX_COUNT:3}
app.policy.no-show.window-days=${NO_SHOW_WINDOW_DAYS:180}
app.policy.no-show.enforcement=${NO_SHOW_ENFORCEMENT:BLOCK}

app.guest-lookup.otp-ttl-minutes=${GUEST_LOOKUP_OTP_TTL_MINUTES:10}
app.guest-lookup.max-attempts=${GUEST_LOOKUP_MAX_ATTEMPTS:5}
app.guest-lookup.max-requests-per-window=${GUEST_LOOKUP_MAX_REQUESTS:5}
app.guest-lookup.rate-window-minutes=${GUEST_LOOKUP_RATE_WINDOW_MINUTES:15}
# Chỉ bật ở dev/test — production phải gửi OTP qua SMS.
app.guest-lookup.expose-otp=${GUEST_LOOKUP_EXPOSE_OTP:false}
