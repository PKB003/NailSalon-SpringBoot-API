spring.application.name=booking-service

# Test dùng H2 in-memory (không cần MySQL chạy sẵn)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate — test dựng schema trực tiếp, không chạy Flyway
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.flyway.enabled=false

# Server
server.port=8080

# JWT
JWT_SECRET_KEY=M0N2OArmuTzgyhbzdBmQeAqKKU/jacPLlDenKym6rYUM/abfXnH3WPpVHNPdEFkl
JWT_VALID_DURATION=3600
JWT_REFRESH_DURATION=7200

# Admin seed (bắt buộc đặt khi production; test dùng giá trị này để login admin)
ADMIN_PASSWORD=12345678

# OpenAPI bật để test contract /v3/api-docs
springdoc.api-docs.enabled=true
